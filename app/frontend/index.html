<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud DevOps Assessment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 500px;
        }

        h1 {
            margin-bottom: 15px;
        }

        #status {
            margin-top: 25px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cloud DevOps Assessment</h1>

        <p>Frontend hosted on Amazon S3</p>
        <p>Backend deployed on Amazon ECS Fargate</p>
        <p>Database hosted on Amazon RDS PostgreSQL</p>

        <div id="status">
            Backend status will appear here after deployment.
        </div>
    </div>
</body>
</html>
